name: camelia
description: "Une application de livraison de colis pour les particuliers et les professionnels."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase - toutes compatibles firebase_core ^3.x
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4
  cloud_functions: ^5.6.2        # ← compatible firebase_core ^3.x

  # Auth
  google_sign_in: ^7.2.0

  # Navigation
  go_router: ^14.2.7

  # Géolocalisation & Cartes
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  # Carte de l'écran A4 de la V2 (sélection d'adresses, seul écran à carte —
  # règle n°11). Affichage mobile gratuit et illimité **sans Map ID** : ne
  # jamais passer `cloudMapId`, qui ferait basculer sur un quota limité.
  google_maps_flutter: ^2.9.0
  # `flutter_map` et `latlong2` restent pour la **V1 encore publiée**, qui a
  # ses propres cartes OSM (`lib/screens/`) : admin, panneau collaborateur,
  # détail de course, sélecteur de position. À retirer à la bascule vers la
  # V2, pas avant — `test/features/client/map_scope_test.dart` garantit déjà
  # qu'aucun écran V2 ne les importe.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Réseau
  http: ^1.2.0
  # Type MediaType des envois multipart (POST /v1/orders/, preuves de course).
  # Déjà résolu en transitif par `http` ; déclaré explicitement car importé
  # directement dans lib/core/api/api_client.dart.
  http_parser: ^4.1.2

  # Charts
  fl_chart: ^1.1.1               # ← version originale

  # Timezone
  timezone: ^0.10.0

  # Média
  image_picker: ^1.0.7
  video_player: ^2.8.2

  # UI & Animations
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  google_fonts: ^8.1.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.2.1

  # État & Utilitaires
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2

  # Sécurité & Notifications
  flutter_secure_storage: ^10.2.0
  flutter_local_notifications: ^20.1.0  # ← version originale (cancel(id:) nommé)
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2

  cupertino_icons: ^1.0.8
  animations: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_pre_commit: ^0.2.4
  flutter_lints: ^6.0.0

flutter_pre_commit:
  format: true
  analyze: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
  # Icônes Phosphor (MIT, voir assets/fonts/phosphor/LICENSE) embarquées
  # directement : le paquet `phosphor_flutter` n'est plus maintenu et ne
  # compile plus depuis que `IconData` est une classe `final`. Élaguées au
  # build release comme toute police d'icônes. Voir lib/core/theme/app_icons.dart.
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo2.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo2.webp"
