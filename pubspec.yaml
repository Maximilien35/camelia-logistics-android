name: camelia
description: "Une application de livraison de colis pour les particuliers et les professionnels, offrant une expérience utilisateur fluide et des fonctionnalités avancées pour suivre et gérer les livraisons en temps réel."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase - versions compatibles entre elles (firebase_core_platform_interface ^7.0.1)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4
  cloud_functions: ^5.6.2

  # Auth
  google_sign_in: ^7.2.0

  # Navigation
  go_router: ^14.2.7

  # Géolocalisation & Cartes
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Réseau
  http: ^1.2.0

  # Charts - version compatible fl_chart (API stable)
  fl_chart: ^0.68.0

  # Timezone
  timezone: ^0.9.4

  # Média
  image_picker: ^1.0.7
  video_player: ^2.8.2

  # UI & Animations
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  google_fonts: ^8.1.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.2.1

  # État & Utilitaires
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2

  # Sécurité & Notifications
  flutter_secure_storage: ^10.2.0
  flutter_local_notifications: ^18.0.0   # API cancel(id) sans paramètre nommé
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_pre_commit: ^0.2.4
  flutter_lints: ^6.0.0

flutter_pre_commit:
  format: true
  analyze: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo2.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo2.webp"
